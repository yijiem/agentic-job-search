[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-job-search"
version = "0.1.0"
description = "Three-agent local job search, personalization, and interview preparation workflow"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
include = ["jobflow*"]
