[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-job-search"
version = "0.1.0"
description = "Three-agent local job search, personalization, and interview preparation workflow"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
include = ["jobflow*"]

[tool.setuptools.package-data]
jobflow = [
  "browser_worker/*.json", "browser_worker/*.js", "browser_worker/*.html",
  "browser_worker/*.css", "browser_worker/*.md",
  "web_assets/*.html", "web_assets/*.css", "web_assets/*.js",
  "web_assets/fonts/*.woff2", "web_assets/fonts/*OFL.txt", "web_assets/fonts/README.md",
  "web_assets/art/*.webp", "web_assets/art/README.md",
  "web_assets/vendor/leaflet/*.js", "web_assets/vendor/leaflet/*.css",
  "web_assets/vendor/leaflet/*.txt", "web_assets/vendor/leaflet/*.md",
  "web_assets/vendor/leaflet/LICENSE",
  "web_assets/vendor/leaflet/images/*.png",
  "web_assets/vendor/maplibre/*.js", "web_assets/vendor/maplibre/*.css",
  "web_assets/vendor/maplibre/*.txt", "web_assets/vendor/maplibre/*.md",
  "web_assets/vendor/pdfjs/*.mjs", "web_assets/vendor/pdfjs/*.md", "web_assets/vendor/pdfjs/LICENSE",
  "web_assets/vendor/pdfjs/cmaps/*", "web_assets/vendor/pdfjs/standard_fonts/*",
  "web_assets/vendor/pdfjs/wasm/*",
  "web_assets/vendor/pdf-lib/*.js", "web_assets/vendor/pdf-lib/*.md",
]
